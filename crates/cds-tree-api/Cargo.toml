[package]
name = "cds-tree-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "REST API server for clinical decision tree traversal"

[dependencies]
# Core
cds-tree-core = { path = "../cds-tree-core" }
cds-tree-storage = { path = "../cds-tree-storage" }
cds-tree-fhir = { path = "../cds-tree-fhir" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "cors",
    "compression-gzip",
    "trace",
    "request-id",
    "set-header",
] }
hyper = "1"
futures-util = "0.3"

# Authentication
jsonwebtoken = "9"
base64 = "0.22"

# Database
sqlx = { version = "0.8", features = [
    "postgres",
    "uuid",
    "chrono",
    "json",
    "runtime-tokio-rustls",
] }

# Configuration
dotenv = "0.15"
envy = "0.10"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"
opentelemetry = "0.26"
opentelemetry-prometheus = "0.14"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Error handling & utilities
async-trait = "0.1"
once_cell = "1"
regex = "1"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[[bin]]
name = "cds-tree-api"
path = "src/main.rs"
