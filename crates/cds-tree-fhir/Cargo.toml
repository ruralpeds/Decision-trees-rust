[package]
name = "cds-tree-fhir"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "FHIR R4 adapters and CDS Hooks integration for clinical decision trees"

[dependencies]
cds-tree-core = { path = "../cds-tree-core" }
cds-tree-storage = { path = "../cds-tree-storage" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true

# HTTP
reqwest = { version = "0.11", features = ["json"], optional = true }

# FHIR-like structures
fhir_serde = { version = "0.4", optional = true }

[features]
default = ["fhir-models"]
fhir-models = []

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
