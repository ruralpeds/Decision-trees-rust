global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'cds-tree'

scrape_configs:
  - job_name: 'cds-tree-api'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
