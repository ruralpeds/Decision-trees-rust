version: "3.9"

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: cds-tree-postgres
    environment:
      POSTGRES_USER: cds_user
      POSTGRES_PASSWORD: cds_password
      POSTGRES_DB: cds_tree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cds_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cds-tree-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: cds-tree-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - cds-tree-network

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: cds-tree-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana-dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - cds-tree-network

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cds-tree-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - cds-tree-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:

networks:
  cds-tree-network:
    driver: bridge
